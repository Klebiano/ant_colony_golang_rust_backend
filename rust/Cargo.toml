[package]
name = "ant_colony_rust_backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "ant_colony_rust_backend"
path = "src/lib.rs"

[[bin]]
name = "ant_colony_rust_backend"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
rand = "0.8"
csv = "1.3"
tracing = "0.1"
tracing-subscriber = "0.3"
